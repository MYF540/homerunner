name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag in manifest (zip only, no commit)
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import json, sys
          p = "custom_components/homerunner/manifest.json"
          with open(p) as f:
              m = json.load(f)
          m["version"] = sys.argv[1]
          with open(p, "w") as f:
              json.dump(m, f, indent=2)
              f.write("\n")
          PY
      - name: Zip integration
        run: |
          cd custom_components/homerunner
          zip -r ../../homerunner.zip . -x "__pycache__/*" "*/__pycache__/*"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: homerunner.zip
